<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuliya Guseva, Product Designer (UX/UI)</title>
<meta name="description" content="Yuliya Guseva, Product Designer (UX/UI) in London. Internal platforms and operational tools for insurance, payments compliance and investment management.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nav:60px;
  --bg:#EEF4FB; --surface:#FFFFFF; --ink:#0F2440; --muted:#4F6382; --line:#D3E0EF; --accent:#1F6FEB; --tint:#E1ECFB; --ok:#1B7A4E; --ok-bg:#DDF2E6;
  --serif:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B1626; --surface:#122238; --ink:#E6EEF8; --muted:#9DB0C8; --line:#22364F; --accent:#5CA2FF; --tint:#16304F; --ok:#6FD3A0; --ok-bg:#173327; }
}
:root[data-theme="dark"]{ --bg:#0B1626; --surface:#122238; --ink:#E6EEF8; --muted:#9DB0C8; --line:#22364F; --accent:#5CA2FF; --tint:#16304F; --ok:#6FD3A0; --ok-bg:#173327; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--nav) + 16px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

.shell{display:grid; grid-template-columns:minmax(300px,34%) minmax(0,1fr)}
.side{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--nav)); height:calc(100vh - var(--nav) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); padding:clamp(28px,4vw,56px); display:flex; flex-direction:column; border-right:1px solid var(--line); overflow-y:auto}
.main{padding:clamp(28px,4vw,56px) clamp(24px,4vw,64px) 96px; min-width:0}

.name{font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,4.4vw,3.8rem); line-height:1; letter-spacing:-.02em; margin:0 0 6px; text-decoration:none; display:block}
.what{color:var(--muted); margin:0 0 36px}
.bio{font-family:var(--serif); font-size:1.3rem; line-height:1.45; margin:0 0 20px; max-width:30ch}
.status{display:flex; align-items:center; gap:10px; font-size:.9375rem; margin:0 0 28px}
.status i{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none}
.side-foot{margin-top:auto; display:flex; flex-wrap:wrap; gap:8px 20px; padding-top:24px}
.side-foot a{font-weight:500; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:4px; padding:4px 0}
.side-foot a:hover{text-decoration-color:var(--accent); color:var(--accent)}

/* Top navigation */
.topnav{position:sticky; top:0; z-index:30; min-height:calc(var(--nav) + env(safe-area-inset-top,0px)); margin-top:calc(-1 * env(safe-area-inset-top,0px)); padding-top:env(safe-area-inset-top,0px); background:color-mix(in srgb, var(--bg) 97%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.topnav .bar{height:var(--nav); display:flex; align-items:center; justify-content:space-between; gap:24px; padding:0 clamp(20px,4vw,56px)}
.brand{font-family:var(--serif); font-size:1.2rem; text-decoration:none; white-space:nowrap}
.navlinks{display:flex; align-items:center; gap:clamp(14px,2.2vw,28px); margin:0; padding:0; list-style:none}
.navlinks a, .navlinks summary{text-decoration:none; color:var(--muted); font-weight:500; font-size:.9375rem; cursor:pointer; padding:6px 0; display:inline-block}
.navlinks a:hover, .navlinks summary:hover, .navlinks a[aria-current="true"]{color:var(--ink)}
#work, #other, #experience, #education, #about, #contact, .chapter{scroll-margin-top:calc(var(--nav) + env(safe-area-inset-top,0px) + 16px)}

.navlinks .short{display:none}

/* Hero animation: a dense table gets redesigned */
.order{position:relative; height:clamp(240px,26vw,320px); background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:0 0 16px}
.cell{position:absolute; left:0; top:0; border-radius:3px; background:color-mix(in srgb, var(--muted) 28%, var(--surface)); will-change:transform;
  transition:transform .95s cubic-bezier(.65,0,.25,1), width .95s cubic-bezier(.65,0,.25,1), height .6s, opacity .5s, background-color .6s, border-radius .6s}
.cell.hd{background:color-mix(in srgb, var(--muted) 55%, var(--surface))}
.cell.grid{background:var(--line); border-radius:0; height:1px}
.cell.primary{background:var(--ink)}
.cell.secondary{background:color-mix(in srgb, var(--muted) 45%, var(--surface))}
.cell.merged{background:color-mix(in srgb, var(--muted) 30%, var(--surface))}
.cell.status{border-radius:999px; background:var(--accent)}
.cell.status.ok{background:var(--ok)}
.cell.status.warn{background:#E5A11A}
.cell.tool{border-radius:999px; background:var(--surface); border:1.5px solid color-mix(in srgb, var(--muted) 35%, var(--surface)); display:flex; align-items:center; gap:6px; padding:0 9px; overflow:hidden; box-sizing:border-box; color:var(--muted)}
.cell.tool svg{flex:0 0 auto}
.cell.tool .tbar{display:block; flex:0 1 auto; height:5px; border-radius:3px; background:color-mix(in srgb, var(--muted) 40%, var(--surface))}
.cell.tool.search{border-radius:8px; gap:7px}
.cell.tool.search .caret{display:block; width:1.5px; height:10px; background:var(--accent); margin-left:-4px; animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.cell.tool.fbtn{border-radius:7px; justify-content:center; padding:0; color:var(--ink)}
.cell.tool.chip{justify-content:space-between; padding:0 8px 0 10px}
.cell.tool.on{background:var(--accent); border-color:var(--accent); color:#fff}
.cell.tool.on .tbar{background:rgba(255,255,255,.85)}
.cell.hide{opacity:0}
.order-cap{color:var(--muted); font-size:.875rem; margin:0 0 56px}
@media (max-width:900px){ .order-cap{margin-bottom:44px} }

/* Home intro */
.home-side{justify-content:flex-start}
.avatar{width:88px; height:88px; border-radius:50%; object-fit:cover; margin:0 0 22px; display:block}
.home-side .name{font-size:clamp(2.4rem,3.6vw,3.2rem); margin-bottom:6px}
.home-side .what{margin:0 0 28px}
.home-side .bio{font-size:1.3rem; line-height:1.45; margin:0 0 14px; max-width:32ch}
.home-side .bio2{margin:0 0 28px; color:var(--muted); font-size:.9688rem; max-width:44ch}
.contact-row{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 4px}
.contact-row a{display:inline-flex; align-items:center; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); text-decoration:none; font-weight:500; font-size:.9375rem; transition:border-color .15s, color .15s}
.contact-row a:first-child{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.contact-row a:hover{border-color:var(--accent); color:var(--accent)}
.contact-row a:first-child:hover{background:var(--accent); border-color:var(--accent); color:#fff}

/* Skills in the sidebar */
.side-skills{padding-top:24px; margin-top:28px; border-top:1px solid var(--line)}
.side-skills .label{margin-bottom:10px}
.side-skills .chips li{font-size:.8125rem; padding:4px 11px}

/* Home index */
.label{font-size:.875rem; color:var(--muted); margin:0 0 12px}
.index{list-style:none; margin:0 0 72px; padding:0; border-top:1px solid var(--ink)}
.row a{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:start; padding:26px 0 28px; border-bottom:1px solid var(--line); text-decoration:none}
.row .kind{font-size:.875rem; color:var(--accent); font-weight:600; margin:0 0 6px}
.row h2{font-family:var(--serif); font-weight:400; font-size:clamp(1.8rem,3.2vw,2.7rem); line-height:1.08; letter-spacing:-.015em; margin:0 0 10px; transition:color .15s; max-width:22ch}
.row p.line{margin:0; color:var(--muted); max-width:52ch}
.row .dur{font-size:.875rem; color:var(--muted); white-space:nowrap; padding-top:4px}
.row a:hover h2, .row a:focus-visible h2{color:var(--accent)}
.thumb{display:none}

.peek{position:fixed; left:0; top:0; width:clamp(300px,30vw,460px); border-radius:6px; overflow:hidden; pointer-events:none; opacity:0; transform:translate(-9999px,0); z-index:20; background:var(--surface); box-shadow:0 18px 40px -18px rgba(24,27,34,.45)}
.peek.on{opacity:1}
.peek img, .thumb img{width:100%; height:auto}

/* Case study */
.case-side .back{text-decoration:none; color:var(--muted); font-weight:500; margin-bottom:40px; display:inline-block; padding:4px 0}
.case-side .back{display:inline-flex; align-items:center; gap:8px}
.case-side .back svg{transition:transform .2s}
.case-side .back:hover{color:var(--accent)}
.case-side .back:hover svg{transform:translateX(-3px)}
.case-side .kind{font-size:.875rem; color:var(--accent); font-weight:600; margin:0 0 8px}
.case-side h1{font-family:var(--serif); font-weight:400; font-size:clamp(2rem,3.2vw,2.9rem); line-height:1.06; letter-spacing:-.015em; margin:0 0 16px}
.case-side .sum{font-family:var(--serif); font-size:1.15rem; line-height:1.45; margin:0 0 28px; color:var(--muted)}
.facts{margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 20px; border-top:1px solid var(--line); padding-top:20px}
.facts dt{color:var(--muted)}
.facts dd{margin:0; font-weight:500}
.toc{margin-top:28px; padding-top:20px; border-top:1px solid var(--line)}
.toc a{display:block; text-decoration:none; color:var(--muted); padding:3px 0; font-size:.9375rem}
.toc a:hover{color:var(--accent)}

.cover{border-radius:6px; overflow:hidden; margin-bottom:48px; background:var(--surface); border:1px solid var(--line)}
.cover img{width:100%}
.blk{margin:0 0 40px}
.prose{max-width:66ch}
.prose h3, .blk > h3{font-family:var(--serif); font-weight:500; font-size:1.45rem; line-height:1.2; margin:0 0 10px}
.prose p{margin:0 0 14px}
.chapter{display:flex; align-items:baseline; gap:16px; margin:72px 0 24px; padding-top:24px; border-top:1px solid var(--ink)}
.chapter .n{font-family:var(--serif); font-size:1.1rem; color:var(--accent); min-width:1.6em}
.chapter h2{font-family:var(--serif); font-weight:400; font-size:clamp(1.7rem,3vw,2.3rem); line-height:1.1; letter-spacing:-.01em; margin:0}

.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); gap:14px}
.cards.even{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.home-sec{margin-top:64px}
.card .meta{font-size:.8125rem; color:var(--accent); font-weight:600; margin:0 0 4px}
.xp{list-style:none; margin:0; padding:0; border-top:1px solid var(--ink)}
.xp li{display:grid; grid-template-columns:220px minmax(0,1fr); gap:4px 20px; padding:14px 0; border-bottom:1px solid var(--line); align-items:baseline}
.xp-co{font-family:var(--serif); font-size:1.25rem}
.xp-role{color:var(--muted)}
.xpd{list-style:none; margin:0; padding:0; border-top:1px solid var(--ink)}
.xpd > li{display:grid; grid-template-columns:260px minmax(0,1fr); gap:12px 40px; padding:32px 0; border-bottom:1px solid var(--line)}
.xpd-head h3{font-family:var(--serif); font-weight:400; font-size:1.6rem; line-height:1.15; margin:0 0 4px}
.xpd-head p{color:var(--muted); margin:0}
.xpd-group + .xpd-group{margin-top:22px}
.xpd-group h4{font-size:1rem; font-weight:600; margin:0 0 10px}
.xpd-group .ul{max-width:72ch}
.xpd-group .ul li{padding-bottom:8px; color:var(--muted)}
.xp-dates{color:var(--muted); font-size:.875rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.chips{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px}
.chips li{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; font-size:.9375rem}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:20px 22px}
.card h4{margin:0 0 6px; font-size:1rem; font-weight:600}
.card p{margin:0; color:var(--muted); font-size:.9688rem}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:14px}
.stat{background:var(--tint); border-radius:8px; padding:22px 24px}
.stat strong{display:block; font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,5vw,3.4rem); line-height:1; color:var(--accent); margin-bottom:8px}
.stat span{font-size:.9375rem}

.quote{font-family:var(--serif); font-style:italic; font-size:clamp(1.3rem,2.2vw,1.6rem); line-height:1.4; margin:0 0 40px; padding-left:20px; border-left:3px solid var(--accent); max-width:40ch}

.steps{list-style:none; margin:0 0 40px; padding:0; display:flex; flex-wrap:wrap; gap:8px; counter-reset:s}
.steps li{counter-increment:s; display:flex; gap:8px; align-items:baseline; border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.9375rem; background:var(--surface)}
.steps li::before{content:counter(s); color:var(--accent); font-weight:600}

.ul{margin:0; padding:0; list-style:none; max-width:66ch}
.ul li{position:relative; padding:0 0 10px 22px}
.ul li::before{content:""; position:absolute; left:2px; top:.65em; width:7px; height:7px; border-radius:50%; background:var(--accent)}
.intro{margin:0 0 12px; max-width:66ch}

figure{margin:0}
.fig{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:clamp(8px,1.5vw,16px); cursor:zoom-in; display:block; width:100%; text-align:left}
.fig img{width:100%; height:auto; border-radius:3px}
.fig.narrow img{max-width:640px; margin:0 auto}
figcaption{color:var(--muted); font-size:.875rem; margin-top:10px}
.pair{display:grid; grid-template-columns:1fr; gap:28px}
.gallery{display:grid; grid-template-columns:1fr; gap:28px}

.next{border-top:1px solid var(--ink); padding-top:20px; margin-top:80px}
.next a{text-decoration:none; display:block}
.next span{color:var(--muted); font-size:.875rem}
.next strong{display:block; font-family:var(--serif); font-weight:400; font-size:clamp(1.7rem,3.2vw,2.6rem); line-height:1.1}
.next a:hover strong{color:var(--accent)}

/* Image viewer */
dialog.viewer{border:0; padding:0; max-width:100vw; max-height:100vh; width:100vw; height:100vh; background:rgba(10,12,16,.92); margin:0}
dialog.viewer::backdrop{background:transparent}
.viewer .scroll{width:100%; height:100%; overflow:auto; display:flex; padding:calc(env(safe-area-inset-top,0px) + 56px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.viewer img{margin:auto; max-width:none; width:min(1400px, 100%); background:#fff; border-radius:4px}
.viewer .close{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); right:16px; background:#fff; color:#181B22; border:0; border-radius:999px; padding:8px 16px; font-weight:600; cursor:pointer}
.viewer .zoom{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); left:16px; background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:999px; padding:8px 16px; font-weight:600; cursor:pointer}
.viewer.big img{width:max(1400px, 200%)}

@media (prefers-reduced-motion: no-preference){
  .row{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  .row:nth-child(2){animation-delay:.07s}.row:nth-child(3){animation-delay:.14s}.row:nth-child(4){animation-delay:.21s}
  @keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
  .peek{transition:opacity .18s}
}

@media (max-width:900px){
  :root{--nav:52px}
  .topnav .bar{gap:12px; padding:0 16px}
  .brand{font-size:1rem}
  .navlinks{gap:12px}
  .navlinks a{white-space:nowrap; padding:8px 0; font-size:.8125rem}
  .shell{display:block}
  .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); padding:28px 20px 28px}
  .main{padding:28px 20px 72px}
  .side-foot{margin-top:4px; padding-top:8px}
  .name{font-size:2.6rem}
  .what{margin-bottom:24px}
  .bio{font-size:1.2rem}
  .row a{grid-template-columns:1fr; gap:0}
  .row .dur{display:block; padding:6px 0 0; order:-1}
  .xp li{grid-template-columns:1fr}
  .xpd > li{grid-template-columns:1fr; padding:26px 0}
  .home-sec{margin-top:48px}
  .thumb{display:block; border-radius:6px; overflow:hidden; margin-top:16px; border:1px solid var(--line); background:var(--surface)}
  .peek{display:none}
  .case-side .back{margin-bottom:20px}
  .toc{display:none}
  .chapter{margin-top:56px}
  .cover{margin-bottom:36px}
}
@media (max-width:360px){
  .topnav .bar{padding:0 12px; gap:8px}
  .brand{font-size:.9rem}
  .navlinks{gap:9px}
  .navlinks a{font-size:.75rem}
}

/* ===== Single-scroll layout ===== */
.page{max-width:1180px; margin:0 auto; padding:0 clamp(20px,4vw,56px) 96px}
.topnav .bar{max-width:1180px; margin:0 auto}
.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:clamp(32px,5vw,72px); align-items:center; padding:clamp(48px,8vw,104px) 0 clamp(40px,6vw,72px)}
.hero .name{font-family:var(--serif); font-weight:400; font-size:clamp(2.8rem,5.4vw,4.6rem); line-height:1; letter-spacing:-.025em; margin:0 0 10px}
.hero .what{color:var(--muted); margin:0 0 28px}
.hero .bio{font-family:var(--serif); font-size:clamp(1.25rem,1.9vw,1.5rem); line-height:1.4; margin:0 0 14px; max-width:34ch}
.hero .bio2{color:var(--muted); margin:0 0 28px; max-width:52ch}
.hero-art .order{margin-bottom:12px}
.hero-art .order-cap{margin:0}
.skills-strip{padding:8px 0 28px; border-bottom:1px solid var(--line)}
.skills-strip .label{margin-bottom:12px}
.skills-strip .chips li{font-size:.875rem}
.home-sec.first{margin-top:clamp(56px,7vw,88px)}
.home-sec{margin-top:88px}
.index{margin-bottom:0}
.row a{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:clamp(24px,4vw,56px); align-items:center; padding:clamp(28px,4vw,44px) 0}
.row .thumb{display:block; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--surface); transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.row a:hover .thumb{transform:translateY(-4px)}
.row .read{display:inline-block; margin-top:18px; font-weight:600; font-size:.9375rem; color:var(--accent)}
.row h2{max-width:20ch}
.peek{display:none}

.case-head{padding:clamp(36px,6vw,72px) 0 36px}
.case-head .back{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--muted); font-weight:500; margin-bottom:36px; padding:4px 0}
.case-head .back svg{transition:transform .2s}
.case-head .back:hover{color:var(--accent)}
.case-head .back:hover svg{transform:translateX(-3px)}
.case-head .kind{font-size:.875rem; color:var(--accent); font-weight:600; margin:0 0 10px}
.case-head h1{font-family:var(--serif); font-weight:400; font-size:clamp(2.3rem,5vw,4rem); line-height:1.04; letter-spacing:-.02em; margin:0 0 18px; max-width:20ch}
.case-head .sum{font-family:var(--serif); font-size:clamp(1.15rem,1.8vw,1.4rem); line-height:1.45; color:var(--muted); margin:0 0 36px; max-width:46ch}
.case-head .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); gap:20px 28px; border-top:1px solid var(--line); padding-top:22px; margin:0}
.case-head .facts div{min-width:0}
.case-head .facts dt{color:var(--muted); font-size:.875rem; margin-bottom:2px}
.case-head .facts dd{margin:0; font-weight:500}
.case-page .cover{margin:0 0 clamp(40px,6vw,72px)}
.case-body{max-width:880px; margin:0 auto}

@media (max-width:900px){
  .hero{grid-template-columns:1fr; padding-top:36px; gap:32px}
  .row a{grid-template-columns:1fr; gap:18px}
  .row .thumb{order:-1; margin:0}
  .home-sec{margin-top:64px}
}

/* Headings in the same typeface as body text */
.hero .name, .name, .case-head h1, .case-side h1{font-weight:700; letter-spacing:-.035em}
.row h2, .chapter h2, .next strong, .xpd-head h3, .xp-co{font-weight:600; letter-spacing:-.025em}
.prose h3, .blk > h3{font-weight:600; letter-spacing:-.015em}
.stat strong{font-weight:700; letter-spacing:-.03em; font-size:clamp(2rem,3.6vw,2.8rem)}
.brand{font-weight:600; letter-spacing:-.01em}
.hero .bio, .case-head .sum, .bio{font-weight:400; letter-spacing:-.01em}
.quote{font-style:normal; font-weight:500}
.chapter .n{font-weight:600}

/* Contact block at the end of pages */
.talk{margin-top:clamp(72px,9vw,120px); padding:clamp(32px,5vw,56px); background:var(--surface); border:1px solid var(--line); border-radius:16px}
.talk h2{font-size:clamp(2rem,4.4vw,3.2rem); font-weight:700; letter-spacing:-.035em; line-height:1.05; margin:0 0 14px}
.talk-text{color:var(--muted); max-width:52ch; margin:0 0 24px}
.talk-mail{display:inline-block; font-size:clamp(1.15rem,2.4vw,1.6rem); font-weight:600; letter-spacing:-.015em; color:var(--accent); text-decoration:none; border-bottom:2px solid currentColor; margin:0 0 28px; word-break:break-word}
.talk-mail:hover{color:var(--ink)}
.case-page .talk{max-width:880px; margin-left:auto; margin-right:auto}
.edu li{grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto}
@media (max-width:900px){ .edu li{grid-template-columns:1fr} }

.xpd.collapsed .xp-more{display:none}
.xp-toggle{display:inline-flex; align-items:center; gap:8px; margin-top:24px; padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:.9375rem; cursor:pointer; transition:border-color .15s, color .15s}
.xp-toggle:hover{border-color:var(--accent); color:var(--accent)}
.xp-toggle svg{transition:transform .25s}
.xp-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}

.xpd-head .xpd-dates{margin-top:6px; font-size:.875rem; font-variant-numeric:tabular-nums; color:var(--accent); font-weight:500}

.hero .what{margin:0 0 16px; font-weight:500; color:var(--accent)}
.hero h1.bio{font-size:clamp(1.6rem,2.8vw,2.3rem); line-height:1.25; font-weight:600; letter-spacing:-.025em; max-width:26ch; margin:0 0 18px}

.card{display:flex; flex-direction:column}
.card-link{display:inline-flex; align-items:center; gap:6px; margin-top:auto; padding-top:16px; font-weight:600; font-size:.9375rem; color:var(--accent); text-decoration:none}
.card-link:hover{text-decoration:underline; text-underline-offset:3px}
.card-link svg{transition:transform .2s}
.card-link:hover svg{transform:translate(2px,-2px)}

/* Hero contacts: email + LinkedIn as text links, CV as the one button */
.hero-contact{display:flex; flex-direction:column; align-items:flex-start; gap:20px; padding-top:22px; border-top:1px solid var(--line)}
.hc-links{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px}
.hc-link + .hc-link{position:relative}
.hc-link{display:inline-flex; align-items:center; gap:7px; color:var(--ink); text-decoration:none; font-weight:500; font-size:.9688rem; padding:4px 0; white-space:nowrap}
.hc-link svg{color:var(--accent); flex:none}
.hc-link span{border-bottom:1px solid transparent; transition:border-color .15s}
.hc-link:hover span{border-bottom-color:currentColor}
.hc-link:hover{color:var(--accent)}
.hc-link .hc-arrow{color:var(--muted); margin-left:-3px; transition:transform .2s}
.hc-link:hover .hc-arrow{transform:translate(2px,-2px); color:var(--accent)}
.hc-cv{display:inline-flex; align-items:center; gap:8px; padding:11px 20px 11px 16px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:.9375rem; box-shadow:0 6px 16px -8px color-mix(in srgb, var(--accent) 70%, transparent); transition:background .15s, transform .15s}
.hc-cv:hover{background:color-mix(in srgb, var(--accent) 85%, #000); transform:translateY(-1px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hc-cv{color:#0B1626} }
:root[data-theme="dark"] .hc-cv{color:#0B1626}

/* Case studies: two per row, image on top */
.index{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(28px,4vw,48px) clamp(20px,3vw,36px); border-top:0; padding-top:8px}
.row{min-width:0}
.row a{display:flex; flex-direction:column; align-items:stretch; gap:20px; padding:0; border-bottom:0; height:100%}
.row .thumb{order:-1; aspect-ratio:16/10; margin:0}
.row .thumb img{width:100%; height:100%; object-fit:cover; object-position:center}
.row .kind{margin-bottom:8px}
.row h2{font-size:clamp(1.35rem,2vw,1.7rem); line-height:1.2; max-width:none; margin-bottom:8px}
.row p.line{font-size:.9688rem}
.row .read{margin-top:14px}
#work > .label{padding-bottom:16px; border-bottom:1px solid var(--ink); margin-bottom:28px}
@media (max-width:760px){ .index{grid-template-columns:1fr} }

/* Case studies in white cards */
.row a{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 14px 26px; gap:22px; box-shadow:0 1px 2px rgba(15,36,64,.04); transition:box-shadow .25s, transform .25s, border-color .25s}
.row a:hover{transform:translateY(-3px); box-shadow:0 18px 40px -22px rgba(15,36,64,.35); border-color:color-mix(in srgb, var(--accent) 30%, var(--line))}
.row a:hover .thumb{transform:none}
.row .thumb{border-radius:12px; border:0}
.row .row-text{padding:0 10px}
.index{gap:clamp(20px,2.5vw,28px)}


/* Hero intro: regular text, industries highlighted */
.hero h1.bio, .hero .bio2{font-size:clamp(1.15rem,1.55vw,1.35rem); font-weight:400; line-height:1.6; letter-spacing:-.005em; color:var(--ink); max-width:38ch; margin:0 0 16px}
.hero .bio2{margin-bottom:28px}
.hero .hl{font-weight:600; color:var(--accent); background:linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 16%, transparent) 62%); padding:0 2px; border-radius:2px}

/* Hero accent: short bold headline + one supporting line */
.hero h1.bio{font-size:clamp(2.2rem,4.3vw,3.5rem); font-weight:700; line-height:1.08; letter-spacing:-.035em; max-width:17ch; margin:0 0 22px; color:var(--ink)}
.hero .bio2{font-size:clamp(1.05rem,1.4vw,1.2rem); line-height:1.6; color:var(--muted); max-width:40ch; margin:0 0 30px}
.hero .bio2 .hl{color:var(--ink)}

/* Never upscale small screenshots: show them at native size, centred */
.fig img{width:auto; max-width:100%; margin:0 auto}

/* Next case studies at the end of each case */
.more-cases{margin-top:clamp(72px,9vw,112px); padding-top:28px; border-top:1px solid var(--ink)}
.more-cases > h2{font-size:1rem; font-weight:500; color:var(--muted); letter-spacing:0; margin:0 0 24px}
.index.small .row h2{color:var(--ink); font-weight:600}
.index.small h2{font-size:clamp(1.15rem,1.6vw,1.35rem)}
.index.small .row p.line{font-size:.9375rem}
.index.small .row a{gap:18px; padding-bottom:22px}

.case-head .facts .fact-team{grid-column:1/-1}

/* Before/after comparison with an arrow */
.compare{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:16px; align-items:center}
.compare figure{margin:0}
.compare .fig img{width:100%; height:100%; aspect-ratio:16/10; object-fit:contain}
.compare .cmp-arrow{margin-bottom:28px}
.cmp-arrow{width:48px; height:48px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; box-shadow:0 6px 16px -8px color-mix(in srgb, var(--accent) 70%, transparent)}
@media (max-width:760px){
  .compare{grid-template-columns:1fr; justify-items:center}
  .compare figure{width:100%}
  .cmp-arrow{transform:rotate(90deg)}
}

.compare.natural .fig img{aspect-ratio:auto; height:auto; object-fit:initial}
</style>
</head>

      <h1>${esc(p.title)}</h1>

      <dl class="facts">${p.facts.map(([k,v]) => `<div${k === "Team" ? ' class="fact-team"' : ""}><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    </header>
    ${p.cover ? `<div class="cover"><img src="${p.cover}" alt="${esc(p.title)}"></div>` : ""}
    <article class="case-body">
      ${p.blocks.map(block).join("")}
    </article>
    ${more.length ? `<section class="more-cases" aria-labelledby="more-h"><h2 id="more-h">Next case studies</h2><ol class="index small">${more.map(caseCard).join("")}</ol></section>` : ""}

  </div>`;
}

/* Top navigation */
function nav(){
  const c = CONTENT;
  const items = [["about","About me","About", true],["work","Case studies","Work", true]].filter(i => i[3]);
  return `<header class="topnav"><div class="bar">
    <a class="brand" href="#/">${esc(c.name)}</a>
    <nav aria-label="Site"><ul class="navlinks">${items.map(([id,label,short]) => `<li><a href="#/s/${id}"><span class="full">${label}</span><span class="short">${short}</span></a></li>`).join("")}</ul></nav>
  </div></header>`;
}
/* Experience: show the latest role, expand to see all */
document.addEventListener("click", e => {
  const b = e.target.closest("#xpToggle"); if (!b) return;
  const list = document.getElementById("xpList");
  const open = list.classList.toggle("collapsed") === false;
  b.setAttribute("aria-expanded", open);
  b.querySelector("span").textContent = open ? "Show less" : "View all experience";
  if (!open) document.getElementById("experience").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
});

/* Internal navigation: handled by the page itself, so it works even when the
   page is embedded somewhere that intercepts link clicks. */
let ROUTE = location.hash || "#/";
function go(href){
  ROUTE = href;
  try { history.pushState(null, "", href); } catch (err) {}
  render();
}
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  e.stopPropagation();
  go(a.getAttribute("href"));
}, true);
window.addEventListener("popstate", () => { ROUTE = location.hash || "#/"; render(); });

/* Hero animation: a dense, hard-to-read table gets redesigned:
   columns are grouped, key data is emphasised, statuses become pills,
   a filter bar appears and irrelevant rows are filtered out. */
const DT = { rows: 8, cols: 9, keep: [0,2,3,5,7] };
function demoHTML(){
  let h = "";
  for (let c = 0; c < DT.cols; c++) h += `<span class="cell hd" data-hd="${c}"></span>`;
  for (let r = 0; r <= DT.rows; r++) h += `<span class="cell grid" data-grid="${r}"></span>`;
  for (let r = 0; r < DT.rows; r++) for (let c = 0; c < DT.cols; c++) h += `<span class="cell" data-r="${r}" data-c="${c}"></span>`;
  const ico = (d, w = 12) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  h += `<span class="cell tool search" data-tool="search">${ico('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>')}<i class="tbar" style="width:46%"></i><i class="caret"></i></span>`;
  const chipW = ["58%","48%","52%"];
  for (let i = 0; i < 2; i++) h += `<span class="cell tool chip" data-tool="chip${i}"><i class="tbar" style="width:${chipW[i]}"></i>${ico('<path d="M6 9l6 6 6-6"/>', 10)}</span>`;
  return `<div class="order" id="demo" role="img" aria-label="Abstract animation: a dense table with many columns is redesigned into a clear, filtered, readable table">${h}</div>
  <p class="order-cap">Making dense data clear and easy to scan.</p>`;
}
let demoGen = 0;
function runDemo(){
  const gen = ++demoGen;
  const box = document.getElementById("demo"); if (!box) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const alive = () => gen === demoGen && document.body.contains(box);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const q = sel => [...box.querySelectorAll(sel)];
  const cells = q("[data-r]"), heads = q("[data-hd]"), grids = q("[data-grid]"), tools = q("[data-tool]");
  const rnd = (a, b) => a + Math.random() * (b - a);
  let widths = [];
  const reroll = () => { widths = cells.map(() => rnd(.45, .95)); };
  const set = (el, x, y, w, h, extra = {}) => {
    el.style.transform = `translate(${x}px,${y}px)`; el.style.width = w + "px"; el.style.height = h + "px";
    el.style.transitionDelay = (extra.delay || 0) + "ms";
    el.style.opacity = extra.opacity ?? 1;
  };
  const cls = (el, list) => { el.classList.remove("primary","secondary","merged","status","ok","warn","hide"); list.forEach(c => c && el.classList.add(c)); };

  function messy(){
    const W = box.clientWidth, H = box.clientHeight, pad = Math.max(14, W * .04);
    const top = pad + 6, colW = (W - pad * 2) / DT.cols, rowH = (H - top - pad - 14) / DT.rows, h = Math.max(4, Math.min(6, rowH * .32));
    heads.forEach((el, c) => { cls(el, []); set(el, pad + c * colW + 3, top, colW * .7, 5, {delay: 0}); });
    grids.forEach((el, r) => { set(el, pad, top + 14 + r * rowH, W - pad * 2, 1, {opacity: 1}); });
    cells.forEach((el, i) => {
      const r = +el.dataset.r, c = +el.dataset.c;
      cls(el, []);
      set(el, pad + c * colW + 3, top + 14 + r * rowH + (rowH - h) / 2, Math.max(6, (colW - 6) * widths[i]), h, {delay: 0});
    });
    tools.forEach(el => { set(el, pad, -30, 10, 10, {opacity: 0}); });
  }

  function clean(){
    const W = box.clientWidth, H = box.clientHeight, pad = Math.max(16, W * .055);
    const inner = W - pad * 2;
    // toolbar
    const tbY = pad, tbH = 24;
    const narrow = inner < 380, searchW = inner * (narrow ? .42 : .44), chipW = narrow ? 64 : Math.max(56, inner * .16), gap = 6, fx = pad + searchW + 10;
    tools.forEach(el => {
      const k = el.dataset.tool;
      if (k === "search") set(el, pad, tbY, searchW, tbH, {delay: 900});
      else { const i = +k.slice(4), x = fx + i * (chipW + gap); const fits = x + chipW <= W - pad + 2; set(el, x, tbY, chipW, tbH, {delay: 1060 + i * 90, opacity: fits ? 1 : 0}); }
    });
    const headY = tbY + tbH + 18;
    const col = { a: 0, b: inner * .48, s: inner * .78 };
    heads.forEach((el, c) => {
      cls(el, []);
      const map = {0: col.a, 2: col.b, 7: col.s};
      if (c in map) set(el, pad + map[c], headY, c === 7 ? inner * .1 : inner * .14, 5, {delay: 300});
      else set(el, pad + (c === 1 ? col.a : c === 3 ? col.b : col.s), headY, 6, 5, {delay: 0, opacity: 0});
    });
    const bodyTop = headY + 14, rowH = (H - bodyTop - pad) / DT.keep.length;
    grids.forEach((el, r) => {
      if (r <= DT.keep.length) set(el, pad, bodyTop + r * rowH, inner, 1, {delay: 500});
      else set(el, pad, bodyTop + DT.keep.length * rowH, inner, 1, {delay: 0, opacity: 0});
    });
    const statusKinds = ["ok", "", "warn", "ok", ""];
    cells.forEach((el, i) => {
      const r = +el.dataset.r, c = +el.dataset.c, k = DT.keep.indexOf(r);
      const yMid = bodyTop + Math.max(0, k) * rowH + rowH / 2;
      if (k < 0){ // filtered out
        cls(el, []); set(el, el._x || 0, (el._y || 0) + 6, el._w || 10, 5, {delay: 700, opacity: 0});
        return;
      }
      const d = 300 + k * 70;
      if (c === 0){ cls(el, ["primary"]); set(el, pad + col.a, yMid - 9, inner * (.24 + widths[i] * .14), 8, {delay: d}); }
      else if (c === 1){ cls(el, ["secondary"]); set(el, pad + col.a, yMid + 4, inner * (.14 + widths[i] * .1), 5, {delay: d + 60}); }
      else if (c === 2){ cls(el, ["merged"]); set(el, pad + col.b, yMid - 3, inner * (.14 + widths[i] * .1), 6, {delay: d + 120}); }
      else if (c === 3){ cls(el, ["merged"]); set(el, pad + col.b, yMid - 3, inner * .1, 6, {delay: d + 120, opacity: 0}); }
      else if (c === 7){ const s = statusKinds[k]; cls(el, ["status", s]); set(el, pad + col.s, yMid - 6, inner * .11, 12, {delay: d + 260}); }
      else { cls(el, []); set(el, pad + (c < 7 ? col.b : col.s), yMid - 3, 6, 5, {delay: 0, opacity: 0}); }
    });
  }
  const remember = () => cells.forEach(el => { const m = /translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(el.style.transform) || []; el._x = +m[1] || 0; el._y = +m[2] || 0; el._w = parseFloat(el.style.width) || 10; });

  reroll();
  if (reduce){ messy(); remember(); clean(); return; }
  (async () => {
    box.querySelectorAll(".cell").forEach(el => el.style.transition = "none");
    messy(); remember();
    void box.offsetWidth;
    box.querySelectorAll(".cell").forEach(el => el.style.transition = "");
    while (alive()){
      await wait(2600); if (!alive()) return;
      remember(); clean();
      await wait(4800); if (!alive()) return;
      reroll(); messy();
    }
  })();
}
let demoW = innerWidth, demoT;
window.addEventListener("resize", () => { if (innerWidth === demoW) return; demoW = innerWidth; clearTimeout(demoT); demoT = setTimeout(() => { if (document.getElementById("demo")) runDemo(); }, 250); });

/* Hover preview on the home page */
const peek = document.getElementById("peek");
function bindPeek(){
  if (!matchMedia("(hover:hover) and (min-width:901px)").matches) return;
  document.querySelectorAll(".row a").forEach(a => {
    a.addEventListener("mouseenter", () => {
      const p = CONTENT.projects[a.dataset.i];
      if (!p.cover) return;
      peek.innerHTML = `<img src="${p.cover}" alt="">`;
      peek.classList.add("on");
    });
    a.addEventListener("mouseleave", () => peek.classList.remove("on"));
  });
}
document.addEventListener("mousemove", e => {
  if (!peek.classList.contains("on")) return;
  const w = peek.offsetWidth, h = peek.offsetHeight;
  const x = Math.min(e.clientX + 24, innerWidth - w - 16), y = Math.min(Math.max(e.clientY - h/2, 16), innerHeight - h - 16);
  peek.style.transform = `translate(${x}px,${y}px)`;
});

/* Image viewer: tap any screenshot to see it large */
const viewer = document.getElementById("viewer"), vimg = document.getElementById("viewerImg"), zoomBtn = document.getElementById("zoomBtn");
document.addEventListener("click", e => {
  const f = e.target.closest(".fig");
  if (f){ vimg.src = f.querySelector("img").src; vimg.alt = f.getAttribute("aria-label") || ""; viewer.classList.remove("big"); zoomBtn.textContent = "Zoom in"; viewer.showModal(); return; }
  const j = e.target.closest("[data-jump]");
  if (j){ e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:"smooth"}); }
});
document.getElementById("closeBtn").onclick = () => viewer.close();
zoomBtn.onclick = () => { const b = viewer.classList.toggle("big"); zoomBtn.textContent = b ? "Fit to screen" : "Zoom in"; };
viewer.addEventListener("click", e => { if (e.target.classList.contains("scroll")) viewer.close(); });

function render(){
  const h = ROUTE;
  const m = h.match(/^#\/work\/(.+)$/);
  const s = h.match(/^#\/s\/(.+)$/);
  if (!m && !s && h && h !== "#/" && document.querySelector(".case-page")) return;
  const p = m && CONTENT.projects.find(x => x.id === decodeURIComponent(m[1]));
  const app = document.getElementById("app");
  peek.classList.remove("on");
  document.body.style.overflow = "";
  if (p){ app.innerHTML = nav() + study(p); document.title = `${p.title}, ${CONTENT.name}`; window.scrollTo(0, 0); }
  else {
    const onHome = !!document.querySelector(".hero");
    if (!onHome || !s){
      app.innerHTML = nav() + home(); document.title = `${CONTENT.name}, ${CONTENT.what}`; runDemo();
      window.scrollTo(0, 0);
    }
    if (s){
      const id = s[1], el = document.getElementById(id);
      const behavior = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
      requestAnimationFrame(() => {
        if (id === "about" || !el) window.scrollTo({top:0, behavior});
        else el.scrollIntoView({block:"start", behavior});
      });
    }
  }
}
window.addEventListener("hashchange", () => { if ((location.hash || "#/") !== ROUTE){ ROUTE = location.hash || "#/"; render(); } });
render();
</script>
